<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Phương - Happiness Coach — Thanh toán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFBF8; --surface: #FFFFFF; --text: #3D2222; --text-muted: #6B4848;
    --accent: #C96A6A; --accent-deep: #8C4646; --accent-soft: rgba(201, 106, 106, 0.12);
    --border: rgba(61, 34, 34, 0.12); --radius: 14px;
    --font-h: 'Lora', Georgia, serif; --font-b: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-b); background: var(--bg); color: var(--text); line-height: 1.6; padding: 40px 20px; }
  .container { max-width: 560px; margin: 0 auto; background: var(--surface); padding: 36px 32px; border-radius: var(--radius); box-shadow: 0 12px 40px var(--accent-soft); border: 1px solid var(--border); }
  h1 { font-family: var(--font-h); font-size: 22px; margin-bottom: 4px; color: var(--text); }
  .lead { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
  .bumps-label { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-deep); margin-bottom: 10px; }
  .bumps { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 20px; }
  .bump { display: flex; align-items: flex-start; padding: 12px 10px; cursor: pointer; border-radius: 8px; }
  .bump:hover { background: var(--accent-soft); }
  .bump input { margin-right: 12px; margin-top: 4px; flex-shrink: 0; }
  .bump-info { flex: 1; }
  .bump-name { font-weight: 600; font-size: 14px; }
  .bump-price { color: var(--accent-deep); font-weight: 700; font-size: 14px; }
  .bump-desc { font-size: 13px; color: var(--text-muted); }
  .summary { background: var(--text); color: #fff; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
  .summary-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
  .summary-total { font-size: 22px; font-weight: 800; font-family: var(--font-h); color: #F0C9C9; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.2); margin-top: 8px; }
  .qr-section { text-align: center; padding: 20px 0; }
  .qr-section img { max-width: 280px; border: 4px solid var(--bg); border-radius: 10px; }
  .info-box { background: #FFF3ED; border: 1px solid var(--accent); padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  .info-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
  .info-row strong { font-family: monospace; font-size: 15px; }
  .status { padding: 14px; text-align: center; border-radius: 8px; font-weight: 600; font-size: 15px; margin-top: 16px; }
  .status.pending { background: #FDECEC; color: #a93226; }
  .status.paid { background: #E7F5E9; color: #2e7d32; }
  .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: currentColor; margin-right: 8px; vertical-align: middle; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
<div class="container">
  <h1>Hoàn tất thanh toán</h1>
  <p class="lead">Chuyển khoản theo thông tin dưới đây — đơn được xác nhận tự động trong 30 giây.</p>

  <div class="bumps-label">Chọn gói của bạn (chỉ chọn 1)</div>
  <div class="bumps" id="bumpsSection">
    <label class="bump">
      <input type="radio" name="bumpChoice" id="bumpNone" value="none" checked>
      <div class="bump-info">
        <div><span class="bump-name">Chỉ Vé VIP</span></div>
        <div class="bump-desc">Tham dự 2 buổi Workshop + Workbook + Video Recording</div>
      </div>
    </label>
    <label class="bump">
      <input type="radio" name="bumpChoice" id="bump1" value="bump1">
      <div class="bump-info">
        <div><span class="bump-name">Bộ Công Cụ Chẩn Đoán Chuyên Sâu</span> · <span class="bump-price">+99.000đ</span></div>
        <div class="bump-desc">Bài test chuyên sâu giúp bạn hiểu vì sao mình chưa gặp được người phù hợp</div>
      </div>
    </label>
    <label class="bump">
      <input type="radio" name="bumpChoice" id="bump2" value="bump2">
      <div class="bump-info">
        <div><span class="bump-name">Bộ Công Cụ + Phiên Khai Vấn 1:1</span> · <span class="bump-price">+499.000đ</span></div>
        <div class="bump-desc">Bao gồm bộ công cụ chẩn đoán + 1 phiên khai vấn 1:1 giải mã kết quả chuyên sâu cùng Phương</div>
      </div>
    </label>
  </div>

  <div class="summary">
    <div class="summary-row"><span>Vé VIP — Bản Đồ Tình Yêu</span><span id="base">99.000đ</span></div>
    <div class="summary-row" id="bumpRow" style="display:none"><span id="bumpRowName"></span><span id="bumpRowPrice"></span></div>
    <div class="summary-row summary-total"><span>Tổng</span><span id="total">99.000đ</span></div>
  </div>

  <div class="qr-section">
    <img id="qrImg" alt="QR thanh toán">
  </div>

  <div class="info-box">
    <div class="info-row"><span>Ngân hàng</span><strong>VietinBank</strong></div>
    <div class="info-row"><span>Số TK</span><strong>109006855197</strong></div>
    <div class="info-row"><span>Chủ TK</span><strong>TO THI MY PHUONG</strong></div>
    <div class="info-row"><span>Nội dung CK</span><strong id="ckContent">—</strong></div>
    <div class="info-row"><span>Số tiền</span><strong id="amount">—</strong></div>
  </div>

  <div class="status pending" id="statusBox">
    <span class="pulse"></span><span id="statusText">Đang chờ giao dịch...</span>
  </div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxgJsI1X1bJrDc0hbCk4EIrD7RzajFIuVk1jd22Z-7QNONFQ8XiTMHiRNZfBqbQHNulzQ/exec';
  const BASE_PRICE = 99000;
  const BUMP1_PRICE = 99000;
  const BUMP1_NAME = 'Bộ Công Cụ Chẩn Đoán Chuyên Sâu';
  const BUMP2_PRICE = 499000;
  const BUMP2_NAME = 'Bộ Công Cụ + Phiên Khai Vấn 1:1';
  const BANK_ACCOUNT = '109006855197';
  const BANK_CODE = 'ICB'; // Mã ngân hàng VietinBank theo chuẩn VietQR — kiểm tra lại trong Sepay dashboard nếu QR không hiện

  const order = JSON.parse(sessionStorage.getItem('order') || '{}');
  if (!order.orderId) { window.location.href = '/dang-ky'; }

  document.getElementById('ckContent').textContent = order.ckContent;

  function formatVnd(n) { return Number(n).toLocaleString('en-US').replace(/,/g, '.'); }

  function calcTotal() {
    const choice = document.querySelector('input[name="bumpChoice"]:checked').value;
    let total = BASE_PRICE;
    let bumpName = '', bumpPrice = 0;
    const b1 = choice === 'bump1';
    const b2 = choice === 'bump2';
    if (b1) { total += BUMP1_PRICE; bumpName = BUMP1_NAME; bumpPrice = BUMP1_PRICE; }
    if (b2) { total += BUMP2_PRICE; bumpName = BUMP2_NAME; bumpPrice = BUMP2_PRICE; }
    return { total, b1, b2, bumpName, bumpPrice };
  }

  function updateQR(amount) {
    const url = 'https://qr.sepay.vn/img?acc=' + BANK_ACCOUNT + '&bank=' + BANK_CODE + '&amount=' + amount + '&des=' + encodeURIComponent(order.ckContent);
    document.getElementById('qrImg').src = url;
    document.getElementById('amount').textContent = formatVnd(amount) + 'đ';
    document.getElementById('total').textContent = formatVnd(amount) + 'đ';
  }

  async function updateOrderAPI(b1, b2, total) {
    try {
      await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'updateOrder',
          orderId: order.orderId,
          data: { bump1: b1, bump2: b2, totalAmount: total }
        })
      });
    } catch (err) { console.error('updateOrder failed', err); }
  }

  document.querySelectorAll('input[name="bumpChoice"]').forEach(el => {
    el.addEventListener('change', () => {
      const { total, b1, b2, bumpName, bumpPrice } = calcTotal();
      const row = document.getElementById('bumpRow');
      if (bumpName) {
        row.style.display = 'flex';
        document.getElementById('bumpRowName').textContent = bumpName;
        document.getElementById('bumpRowPrice').textContent = '+' + formatVnd(bumpPrice) + 'đ';
      } else {
        row.style.display = 'none';
      }
      updateQR(total);
      updateOrderAPI(b1, b2, total);
    });
  });

  updateQR(BASE_PRICE);

  async function pollStatus() {
    try {
      const res = await fetch(GAS_URL + '?action=getStatus&orderId=' + encodeURIComponent(order.orderId));
      const json = await res.json();
      if (json.status === 'PAID') {
        const box = document.getElementById('statusBox');
        box.className = 'status paid';
        document.getElementById('statusText').textContent = '✓ Đã nhận giao dịch · Đang chuyển trang...';
        setTimeout(() => { window.location.href = '/xac-nhan'; }, 1500);
        return;
      }
    } catch (err) { console.error('poll failed', err); }
    setTimeout(pollStatus, 5000);
  }
  pollStatus();
</script>
</body>
</html>
