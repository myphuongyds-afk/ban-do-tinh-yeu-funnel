<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Phương - Happiness Coach — Đăng ký</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFBF8; --surface: #FFFFFF; --text: #3D2222; --text-muted: #6B4848;
    --accent: #C96A6A; --accent-deep: #8C4646; --accent-soft: rgba(201, 106, 106, 0.12);
    --border: rgba(61, 34, 34, 0.12); --radius: 14px;
    --font-h: 'Lora', Georgia, serif; --font-b: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-b); background: var(--bg); color: var(--text); line-height: 1.6; padding: 40px 20px; }
  .container { max-width: 480px; margin: 0 auto; background: var(--surface); padding: 36px 32px; border-radius: var(--radius); box-shadow: 0 12px 40px var(--accent-soft); border: 1px solid var(--border); }
  h1 { font-family: var(--font-h); font-size: 24px; margin-bottom: 8px; color: var(--text); }
  .lead { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--text); }
  input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; background: var(--bg); color: var(--text); }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .cta { width: 100%; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%); color: #fff; padding: 15px; font-size: 16px; font-weight: 700; font-family: var(--font-h); border: none; border-radius: var(--radius); cursor: pointer; margin-top: 22px; }
  .cta:hover { opacity: 0.92; }
  .cta:disabled { background: #b8a8a8; cursor: not-allowed; }
  .error { color: #a93226; font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Đăng ký Vé VIP — Bản Đồ Tình Yêu</h1>
  <p class="lead">Điền thông tin để tiếp tục đến trang thanh toán.</p>

  <form id="orderForm">
    <label>Họ tên *</label>
    <input type="text" name="name" required>

    <label>Số điện thoại *</label>
    <input type="tel" name="phone" required pattern="[0-9]{10,11}">

    <label>Email *</label>
    <input type="email" name="email" required>

    <label>Mục tiêu của bạn</label>
    <select name="goal">
      <option value="">-- Chọn mục tiêu --</option>
      <option value="Muốn hiểu vì sao mình chưa gặp đúng người">Muốn hiểu vì sao mình chưa gặp đúng người</option>
      <option value="Muốn có bộ tiêu chuẩn chọn đúng người">Muốn có bộ tiêu chuẩn chọn đúng người</option>
      <option value="Muốn chuẩn bị sẵn sàng cho một mối quan hệ nghiêm túc">Muốn chuẩn bị sẵn sàng cho một mối quan hệ nghiêm túc</option>
    </select>

    <button type="submit" class="cta" id="submitBtn">Tiếp tục thanh toán →</button>
    <p class="error" id="error"></p>
  </form>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxgJsI1X1bJrDc0hbCk4EIrD7RzajFIuVk1jd22Z-7QNONFQ8XiTMHiRNZfBqbQHNulzQ/exec';

  document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('error');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Đang xử lý...';

    const form = new FormData(e.target);
    const data = {
      name: form.get('name'),
      phone: form.get('phone'),
      email: form.get('email'),
      goal: form.get('goal'),
      bump1: false,
      bump2: false,
      totalAmount: 99000
    };

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'createOrder', data: data })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'Order creation failed');

      sessionStorage.setItem('order', JSON.stringify({
        orderId: json.orderId,
        ckContent: json.ckContent,
        totalAmount: json.totalAmount,
        name: data.name,
        email: data.email,
        phone: data.phone,
        goal: data.goal
      }));

      window.location.href = '/checkout';
    } catch (err) {
      errEl.textContent = 'Lỗi: ' + err.message + '. Vui lòng thử lại.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Tiếp tục thanh toán →';
    }
  });
</script>
</body>
</html>
